<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">			
    <title>Holiday Gift Box</title>
    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="../common/3DGift.css">
    <!-- Scripts -->
    <script src="../common/3DGift.js"></script>
</head>

<!--
    List of parameters for the gift design : 
    
    Base Dimensions
    Width: 50-200
    Height: 50-200
    Depth: 50-200

    Cover Dimensions
    Height: 10-50

    Base Design
    Front : RGBA colors or with JPG, JPEG, GIF, or PNG images
    Back : RGBA colors or with JPG, JPEG, GIF, or PNG images
    Left : RGBA colors or with JPG, JPEG, GIF, or PNG images
    Right : RGBA colors or with JPG, JPEG, GIF, or PNG images
    Bottom : RGBA colors or with JPG, JPEG, GIF, or PNG images

    Cover Design
    Front : RGBA colors or with JPG, JPEG, GIF, or PNG images
    Back : RGBA colors or with JPG, JPEG, GIF, or PNG images
    Left : RGBA colors or with JPG, JPEG, GIF, or PNG images
    Right : RGBA colors or with JPG, JPEG, GIF, or PNG images
    Top : RGBA colors or with JPG, JPEG, GIF, or PNG images
-->

<body>      
    <div class="page__outer-wrap">
        <div class="page__inner-wrap page__inner-wrap--narrow">    
            <div class="giveaway_box_container giveaway_box_container--draggable giveaway_box_container--transition-slow giveaway_box_container--spin" style="margin-bottom: 5px; cursor: grab; --transform_rotate_x: -33deg;" data-moving="0" data-mouse-x="785" data-mouse-y="386" data-rotate-x="51" data-animation-delay="-4095.06">
                <div 
                    data-base-width="120" 
                    data-base-height="120" 
                    data-base-depth="120" 
                    data-cover-height="28" 
                    data-base-front="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-base-back="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-base-left="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-base-right="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-base-bottom="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-cover-front="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-cover-back="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-cover-left="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-cover-right="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                    data-cover-top="https://res.cloudinary.com/db1mkizr6/image/upload/v1765445564/Copilot_20251211_102742_gibbox.png" 
                class="giveaway_box">
                    <div class="giveaway_box_shadow">
                        <div></div>
                    </div>
                    <div class="giveaway_box_base">
                        <div class="front"></div>
                        <div class="back"></div>
                        <div class="left"></div>
                        <div class="right"></div>
                        <div class="bottom"></div>
                    </div>
                    <div class="giveaway_box_cover">
                        <div class="front"></div>
                        <div class="back"></div>
                        <div class="left"></div>
                        <div class="right"></div>
                        <div class="top"></div>
                    </div>
                </div>
                <p style="user-select: none; font-size: 12px; color: #9fa6b1; text-shadow: none; font-style: italic; padding-bottom: 15px;">Click and drag to rotate. Double click to look inside.</p>
            </div>
        </div>
    </div>
</body></html>
